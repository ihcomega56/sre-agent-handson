spring.application.name=order-api

# ローカル実行時は H2 (PostgreSQL 互換モード)。Azure では App Settings の SPRING_DATASOURCE_* で上書きされる。
spring.datasource.url=jdbc:h2:mem:orders;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
# DB 障害時にリクエストが長時間ハングせず、すぐにエラーとして観測できるようにする
spring.datasource.hikari.connection-timeout=5000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info

app.leak.enabled=false
app.leak.max-mb=600
